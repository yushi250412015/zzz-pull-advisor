<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZZZ 抽卡参谋 · Pull Advisor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ZZZ 抽卡参谋</h1>
        <p class="sub">基于你的 box 与资源，为下版本卡池给出「抽 / 观望 / 跳过」建议（开发中）</p>
      </header>

      <section class="panel">
        <h2>资源</h2>
        <div id="resources-form"></div>
        <p class="hint">
          提示：保底 / 大保底按卡池独立计算（独家与常驻分开）。
          <button id="load-my-account" type="button">载入我的真实账号（uid 25183553 · 2026-08-15 解析）</button>
        </p>
      </section>

      <section class="panel">
        <h2>你的 box</h2>
        <div id="box-form"></div>
      </section>

      <section class="panel">
        <h2>我的真实账号 · 四池状态（uid 25183553 · 2026-08-15 解析）</h2>
        <div id="pools-list"></div>
        <p class="hint">音擎 / 邦布池为真实抽卡记录解析结果，仅作状态参考；音擎 / 邦布的「抽卡推荐」待后续版本接入。</p>
      </section>

      <section class="panel">
        <h2>推荐结果</h2>
        <div id="results-list"></div>
      </section>

      <section class="panel">
        <h2>时序规划 · MCTS：现在抽 vs 攒希格莉德</h2>
        <p class="hint">比较「现在把预算投入上半池（蕾米埃尔）各比例」与「全部攒给下半希格莉德」的平均成型收益（基于当前 box 与体系先验）。</p>
        <div class="mcts-controls">
          <label>迭代次数 <input type="number" id="mcts-iterations" min="200" max="5000" step="100" value="1000" /></label>
          <button id="run-mcts" type="button">运行 MCTS 规划</button>
        </div>
        <div id="mcts-result"></div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
